version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nearby-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nearby
      MYSQL_USER: nearby
      MYSQL_PASSWORD: nearby
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: 